## Cucumber - Configuración centralizada
cucumber.publish.enabled=false
cucumber.publish.quiet=true
cucumber.glue=auto.framework.selenium.cucumber
cucumber.plugin=pretty, html:target/reports/cucumber-html-report.html, junit:target/reports/cucumber-report.xml, json:target/reports/cucumber-report.json, com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:

## Paralelismo
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4

## Naming
cucumber.junit-platform.naming-strategy=long

## Exclusive resources
cucumber.execution.exclusive-resources.rw-lang.read-write=language
cucumber.execution.exclusive-resources.r-lang.read=language
