# ========== CONFIGURACIÓN PRINCIPAL DEL REPORTE ==========
extent.reporter.spark.start=true
extent.reporter.spark.out=target/reports/VersiaRenal-ExtentReport.html
extent.reporter.spark.config=src/test/resources/extent-config.xml

# ========== NO JSON (ELIMINA ERRORES CON JAVA 17) ==========
# JSON DESACTIVADO - Causa problemas con Java 17+

# ========== CONFIGURACIÓN DE SCREENSHOTS ==========
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log
screenshot.dir=target/screenshots/
screenshot.rel.path=../screenshots/

# ========== INFORMACIÓN DEL SISTEMA ==========
systeminfo.AppName=VersiaRenal
systeminfo.Project=Vantive  
systeminfo.Module=PD Prescription
systeminfo.Environment=Development
systeminfo.user=bismarck.colombo
systeminfo.Browser=Chrome
systeminfo.OS=Windows
systeminfo.Version=3.2

# ========== CONFIGURACIÓN AVANZADA ==========
extent.reporter.spark.offline=false
extent.reporter.spark.theme=dark
basefolder.name=extent-reports
basefolder.dir=target/

# ========== PARA SCREENSHOTS AUTOMÁTICOS ==========
extent.attach.screenshot=true
extent.screenshot.dir=target/screenshots/
extent.screenshot.rel.path=../screenshots/

# ========== CONFIGURACIÓN DE LIMPIEZA ==========
extent.auto.cleanup=true

# ========== CONFIGURACIÓN PDF (AUTOMÁTICO) ==========
extent.reporter.pdf.start=true
extent.reporter.pdf.out=target/reports/VersiaRenal-ExtentReport.pdf
#extent.reporter.pdf.config=src/test/resources/pdf-config.xml